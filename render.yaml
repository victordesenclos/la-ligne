services:
  - type: web
    name: la-ligne
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/config
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MANAGER_PASSWORD
        sync: false
      - key: MANAGER_PASSWORDS
        sync: false
      - key: BUS
        value: Lille,Paris,Lyon,Marseille,Nantes,Bordeaux,Toulouse,Montpellier
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
